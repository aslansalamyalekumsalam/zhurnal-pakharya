<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161A1F" media="(prefers-color-scheme: dark)">
<meta name="description" content="Тренер в телефоне: план на 26 недель, фиксированные подходы, вес на следующий раз считается сам.">
<meta name="robots" content="noindex">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Журнал пахаря">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Журнал пахаря</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@600;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: coach's logbook on a phone — one column; each exercise is a card with a scoreboard target and tap-to-complete set rows. Phase colours follow competition plates (5 white, 10 green, 15 yellow, 20 blue). */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#EDF0F3; --ink:#101418; --ink-2:#56616D; --ink-3:#808A95; --line:#DEE3E8;
  --accent:#2460D6; --accent-ink:#FFFFFF; --accent-soft:#E3EBFB; --name:#6234C4;
  --done:#1C8048; --done-soft:#E6F5EC; --done-line:#B6DEC5;
  --warn:#8F5E00; --warn-soft:#FBF0D5; --drop:#B02B2B; --drop-soft:#FBE4E4;
  --plate5:#FAFBFC; --plate5-edge:#A9B3BE; --plate10:#2E8A56; --plate15:#DDAA0A; --plate20:#2460D6; --deload:#B9C1CA;
  --f-display:"Fira Sans Extra Condensed","Arial Narrow","Roboto Condensed",Arial,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1013; --surface:#161A1F; --surface-2:#1F252B; --ink:#ECEFF2; --ink-2:#A6B0BA; --ink-3:#77818C; --line:#272E36;
  --accent:#7BA5F5; --accent-ink:#0B1426; --accent-soft:#1B2840; --name:#B9A2FF;
  --done:#5FCB8C; --done-soft:#132A1C; --done-line:#265A3B;
  --warn:#E6B552; --warn-soft:#30270F; --drop:#F07575; --drop-soft:#371A1A;
  --plate5:#E4E8EC; --plate5-edge:#E4E8EC; --plate10:#3FA56B; --plate15:#E8B934; --plate20:#6290EE; --deload:#4A535E;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1013; --surface:#161A1F; --surface-2:#1F252B; --ink:#ECEFF2; --ink-2:#A6B0BA; --ink-3:#77818C; --line:#272E36;
  --accent:#7BA5F5; --accent-ink:#0B1426; --accent-soft:#1B2840; --name:#B9A2FF;
  --done:#5FCB8C; --done-soft:#132A1C; --done-line:#265A3B;
  --warn:#E6B552; --warn-soft:#30270F; --drop:#F07575; --drop-soft:#371A1A;
  --plate5:#E4E8EC; --plate5-edge:#E4E8EC; --plate10:#3FA56B; --plate15:#E8B934; --plate20:#6290EE; --deload:#4A535E;
  color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5; margin:0}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface)}
.wrap{max-width:720px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
h1,h2,h3,h4{margin:0; line-height:1.15; text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sub{color:var(--ink-2); font-size:14px}
.tiny{color:var(--ink-3); font-size:12px}

/* header */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--surface); border-bottom:1px solid var(--line)}
.top-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:10px 2px}
.brand{display:flex; align-items:center; gap:8px; white-space:nowrap; font-family:var(--f-display); font-weight:700; font-size:20px; letter-spacing:.03em; text-transform:uppercase}
.status{font-size:12px; color:var(--ink-2); white-space:nowrap; font-variant-numeric:tabular-nums}
.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none; background:none; border:0; border-bottom:3px solid transparent; padding:9px 10px 8px; font-weight:600; font-size:15px; color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}

main{padding-block:20px 120px}
section.view{display:flex; flex-direction:column; gap:14px}

/* today header */
.today-head{display:flex; flex-direction:column; gap:6px; padding-bottom:4px}
.eyebrow{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--ink-2)}
.plate{width:14px; height:14px; border-radius:50%; flex:none; border:2px solid transparent; box-shadow:inset 0 0 0 3px rgba(0,0,0,.14)}
.plate.plate5{background:var(--plate5); border-color:var(--plate5-edge)}
.plate.plate10{background:var(--plate10)} .plate.plate15{background:var(--plate15)} .plate.plate20{background:var(--plate20)} .plate.deload{background:var(--deload)}
.day-title{font-family:var(--f-display); font-size:38px; font-weight:700; text-transform:uppercase; letter-spacing:.01em}
.day-title em{font-style:normal; color:var(--accent)}
.warmup{display:flex; gap:10px; align-items:flex-start; background:var(--surface-2); border-radius:12px; padding:12px 14px; font-size:14px; color:var(--ink-2)}
.warmup b{color:var(--ink); font-weight:600}

/* exercise card */
.ex{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:14px}
.ex.complete{border-color:var(--done-line)}
.ex-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px}
.ex-head > div{min-width:0}
.ex-n{font-size:12px; font-weight:600; color:var(--ink-3); font-variant-numeric:tabular-nums}
.ex h3{font-size:20px; font-weight:700; margin-top:2px; color:var(--name)}
.chip{flex:none; font-size:13px; font-weight:600; border-radius:999px; padding:4px 10px; white-space:nowrap}
.chip.new{background:var(--accent-soft); color:var(--accent)}
.chip.start{background:var(--surface-2); color:var(--ink)}
.chip.up{background:var(--done-soft); color:var(--done)}
.chip.reps{background:var(--accent-soft); color:var(--accent)}
.chip.hold{background:var(--warn-soft); color:var(--warn)}
.chip.drop{background:var(--drop-soft); color:var(--drop)}
.chip.deload{background:var(--surface-2); color:var(--ink-2)}
.board{display:flex; align-items:flex-end; gap:22px; flex-wrap:wrap}
.board > div{display:flex; flex-direction:column}
.board .k{font-size:12px; color:var(--ink-3); font-weight:500}
.board .v{font-family:var(--f-display); font-size:40px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:.01em}
.board .v small{font-size:20px; font-weight:600; margin-left:3px; color:var(--ink-2)}
.board .rest{margin-left:auto; text-align:right}
.board .rest .v{font-size:22px; color:var(--ink-2)}
.coach{font-size:14px; color:var(--ink-2); padding-top:12px; border-top:1px dashed var(--line)}
.coach b{color:var(--ink); font-weight:600}

/* set rows */
.sets{display:flex; flex-direction:column; gap:8px}
.set{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:stretch}
.set-main{display:flex; align-items:center; gap:12px; min-height:54px; padding:0 14px; border:1.5px solid var(--line); border-radius:12px; background:var(--surface); text-align:left}
.set-num{font-family:var(--f-mono); font-size:12px; color:var(--ink-3); width:18px; flex:none}
.set-val{flex:1; min-width:0; font-family:var(--f-display); font-size:24px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--ink)}
.set-val .u{font-size:16px; color:var(--ink-2); font-weight:600}
.set-val .x{color:var(--ink-3); margin:0 4px}
.set-val.missing{color:var(--accent); font-family:var(--f-body); font-size:15px}
.tick{width:30px; height:30px; flex:none; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; color:transparent; font-weight:700; font-size:16px}
.set.is-done .set-main{background:var(--done-soft); border-color:var(--done-line)}
.set.is-done .tick{background:var(--done); border-color:var(--done); color:var(--surface)}
.set-edit{border:1.5px solid var(--line); background:var(--surface); border-radius:12px; padding:0 12px; font-size:13px; font-weight:600; color:var(--ink-2); min-width:58px}
.set-edit[aria-expanded="true"]{background:var(--surface-2); color:var(--ink)}
.editor{grid-column:1 / -1; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; background:var(--surface-2); border-radius:12px; padding:10px}
.stepper{display:flex; flex-direction:column; gap:4px; min-width:0}
.stepper .k{font-size:12px; color:var(--ink-2); font-weight:500}
.stepper .row{display:grid; grid-template-columns:40px minmax(0,1fr) 40px; gap:4px}
.stepper button{height:44px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-size:20px; font-weight:600}
.stepper input{height:44px; width:100%; min-width:0; text-align:center; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); font-family:var(--f-display); font-size:22px; font-weight:600; font-variant-numeric:tabular-nums}
.ex-foot{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
.prev{font-size:13px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.linkbtn{background:none; border:0; padding:4px 0; color:var(--accent); font-weight:600; font-size:14px}
.err{color:var(--drop); font-size:14px; font-weight:500}

.save{display:flex; flex-direction:column; gap:8px; padding-top:6px}
.primary{background:var(--accent); color:var(--accent-ink); border:0; border-radius:14px; padding:16px 18px; font-weight:600; font-size:17px; width:100%}
.primary:disabled{opacity:.6}
.secondary{background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:11px 16px; font-weight:600; align-self:flex-start}

/* generic blocks */
.block{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:12px}
.block h2{font-family:var(--f-display); font-size:26px; font-weight:700; text-transform:uppercase; letter-spacing:.01em}
.block h3{font-size:18px; font-weight:600}
.intro{display:flex; flex-direction:column; gap:8px}
.intro h2{font-family:var(--f-display); font-size:34px; font-weight:700; text-transform:uppercase}
.intro p{color:var(--ink-2); max-width:62ch}
ul.plain{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px}
ol.steps{margin:0; padding-left:22px; display:flex; flex-direction:column; gap:8px}
ol.steps li::marker{font-weight:700; color:var(--accent)}

.facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px}
.fact{background:var(--surface-2); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:2px}
.fact .k{font-size:12px; color:var(--ink-2); font-weight:500}
.fact .v{font-family:var(--f-display); font-size:30px; font-weight:700; line-height:1.05; font-variant-numeric:tabular-nums}
.fact .d{font-size:13px; color:var(--ink-2)}

.rule-list{display:flex; flex-direction:column}
.rule-row{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.3fr); gap:12px; padding-block:10px; border-top:1px solid var(--line)}
.rule-row:first-child{border-top:0; padding-top:0}
.rule-row b{font-weight:600}
.rule-row span{color:var(--ink-2); font-size:15px}

/* timeline */
.timeline{display:grid; grid-template-columns:repeat(26,minmax(0,1fr)); gap:2px}
.wk{height:26px; border-radius:3px}
.wk.plate5{background:var(--plate5); box-shadow:inset 0 0 0 1px var(--plate5-edge)}
.wk.plate10{background:var(--plate10)} .wk.plate15{background:var(--plate15)} .wk.plate20{background:var(--plate20)} .wk.deload{background:var(--deload)}
.wk.now{outline:2px solid var(--ink); outline-offset:1px}
.tl-scale{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.legend{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:6px}

.phase-card{display:flex; flex-direction:column; gap:10px}
.ph-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.ph-head h3{font-size:19px}
.ph-weeks{font-size:13px; color:var(--ink-2); font-weight:500}
.days{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px}
.day{border:1px solid var(--line); border-radius:12px; padding:12px 14px}
.day h4{font-size:15px; font-weight:600; margin-bottom:6px}
.day h4 em{font-style:normal; color:var(--accent); font-family:var(--f-display); font-size:19px; margin-right:4px}
.drow{display:flex; justify-content:space-between; gap:10px; padding-block:5px; border-top:1px solid var(--line); font-size:14px}
.drow:first-of-type{border-top:0}
.drow span:first-child{min-width:0; color:var(--name); font-weight:500}
.drow .sc{font-family:var(--f-display); font-size:17px; font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums}

/* technique */
.tech{scroll-margin-top:110px}
.tech h3{color:var(--name); font-size:20px; font-weight:700}
.tech-cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px 20px}
.tech .k{font-size:12px; font-weight:600; color:var(--ink-3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px}
.tech .errs li::marker{color:var(--drop)}
.yt{display:inline-flex; align-items:center; gap:8px; font-weight:600; text-decoration:none; border:1.5px solid var(--line); border-radius:12px; padding:10px 14px; align-self:flex-start}
.note{font-size:14px; background:var(--surface-2); border-radius:10px; padding:10px 12px; color:var(--ink-2)}

/* forms, tables */
.form-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px}
.form-row label{display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--ink-2); font-weight:500}
.field{height:48px; width:100%; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:12px; padding:0 12px; font-family:var(--f-display); font-size:22px; font-weight:600; font-variant-numeric:tabular-nums}
.field::placeholder{color:var(--ink-3); font-family:var(--f-body); font-size:15px; font-weight:400}
select.field{font-family:var(--f-body); font-size:16px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums}
th,td{text-align:left; padding:9px 10px 9px 0; border-bottom:1px solid var(--line); font-size:15px; vertical-align:top}
th{font-size:12px; color:var(--ink-3); font-weight:600}
td.big{font-family:var(--f-display); font-size:21px; font-weight:700}
.compare{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px}

/* chart */
.chart{position:relative; width:100%}
.chart svg{display:block; width:100%; height:auto; overflow:visible}
.tip{position:absolute; pointer-events:none; background:var(--ink); color:var(--bg); font-size:12px; padding:4px 8px; border-radius:6px; white-space:nowrap; transform:translate(-50%,-115%)}
.empty{color:var(--ink-2); font-size:14px; background:var(--surface-2); border-radius:12px; padding:14px}

/* history */
.hist-item{display:flex; flex-direction:column; gap:4px; padding-block:12px; border-top:1px solid var(--line)}
.hist-item:first-child{border-top:0; padding-top:0}
.hist-top{display:flex; justify-content:space-between; gap:10px; align-items:baseline; flex-wrap:wrap}
.hist-top b{font-weight:600}
.hist-ex{font-size:13px; color:var(--ink-2)}
.danger{color:var(--drop)}
textarea.field{height:96px; padding:10px 12px; font-family:var(--f-mono); font-size:12px; font-weight:500; resize:vertical}
.btn-row{display:flex; gap:10px; flex-wrap:wrap}

/* timer + toast */
.timer{position:fixed; right:calc(16px + env(safe-area-inset-right,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:8; display:flex; align-items:center; gap:8px; background:var(--ink); color:var(--bg); border-radius:999px; padding:8px 8px 8px 18px; box-shadow:0 8px 24px rgba(0,0,0,.25)}
.timer .t{font-family:var(--f-display); font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; min-width:64px; line-height:1}
.timer .lbl{font-size:12px; opacity:.75}
.timer button{background:var(--surface-2); color:var(--ink); border:0; border-radius:999px; padding:9px 12px; font-weight:600; font-size:13px}
.timer.done{background:var(--done); color:var(--surface)}
.toast{position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 100px); transform:translateX(-50%); z-index:9; background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:12px; font-weight:500; max-width:calc(100% - 32px); box-shadow:0 8px 24px rgba(0,0,0,.25)}
.foot-note{font-size:12px; color:var(--ink-3); text-align:center}

@media (prefers-reduced-motion: no-preference){
  .set-main,.tick,.tab,.set-edit{transition:background-color .15s, color .15s, border-color .15s}
}
@media (max-width:400px){ .day-title{font-size:32px} .board .v{font-size:36px} .rule-row{grid-template-columns:1fr; gap:2px} }
</style>

</head>
<body>
<header class="top">
  <div class="wrap top-row">
    <div class="brand">
      <svg width="26" height="18" viewBox="0 0 26 18" aria-hidden="true"><rect x="0" y="7.5" width="26" height="3" rx="1.5" fill="currentColor"/><rect x="3" y="1" width="4" height="16" rx="1.5" fill="var(--accent)"/><rect x="19" y="1" width="4" height="16" rx="1.5" fill="var(--accent)"/></svg>
      Журнал пахаря
    </div>
    <div class="status" id="status">Неделя 1 · 1 / 78</div>
  </div>
  <nav class="wrap tabs" role="tablist" aria-label="Разделы">
    <button class="tab" role="tab" id="tab-today" data-view="today" aria-selected="true">Сегодня</button>
    <button class="tab" role="tab" id="tab-program" data-view="program" aria-selected="false">План</button>
    <button class="tab" role="tab" id="tab-tech" data-view="tech" aria-selected="false">Техника</button>
    <button class="tab" role="tab" id="tab-weight" data-view="weight" aria-selected="false">Вес</button>
    <button class="tab" role="tab" id="tab-progress" data-view="progress" aria-selected="false">Прогресс</button>
  </nav>
</header>

<main class="wrap">
  <section class="view" id="view-today" aria-labelledby="tab-today"></section>
  <section class="view" id="view-program" aria-labelledby="tab-program" hidden></section>
  <section class="view" id="view-tech" aria-labelledby="tab-tech" hidden></section>
  <section class="view" id="view-weight" aria-labelledby="tab-weight" hidden></section>
  <section class="view" id="view-progress" aria-labelledby="tab-progress" hidden></section>
</main>

<div class="timer" id="timer" hidden>
  <div><div class="lbl" id="timerLbl">Отдых</div><div class="t" id="timerT">2:00</div></div>
  <button id="timerPlus" type="button">+30 с</button>
  <button id="timerStop" type="button">Стоп</button>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';

/* ================= program data ================= */
const L = {A:'А', B:'Б', C:'В'};
const YT = q => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);

/* ladder: [lo, hi] — reps grow first, then weight. Without ladder: fixed reps from the plan. */
const EX = {

function itemCfg(r, ph){

function planFor(n){

  let ph, local;
  if (week > 26){ ph = PHASES.find(p => p.id === 'p3'); local = n - TOTAL; }

  const letter = ph.rot[local % ph.rot.length];
  const day = ph.days[letter];
  return {n, week, ph, letter, day, items: day.list.map(r => itemCfg(r, ph))};
}

}

  return {w, reps, sets, ok: good >= sets};

function target(it, deload){
  const ex = EX[it.id], H = history(it.id);
  const t = {sets:it.sets, reps:it.lo, w:null, state:'new', chip:'Найди вес', note:'Первый раз. Сделай лесенку разминочных подходов и впиши вес, с которым все повторы даются чисто, с запасом в 2–3.', prev:H[0] || null};
  if (deload) t.sets = Math.max(2, Math.ceil(it.sets / 2));
  if (!H.length){
    if (ex.bw && !ex.inc){ Object.assign(t, {w:0, state:'start', chip:'Старт', note:'Свой вес. Медленно, без раскачки.'}); }
    if (deload) t.note = 'Разгрузка: лёгкий вес, работаем над техникой.';
    return t;
  }
  const L0 = evalEntry(H[0], it);
  let w = L0.w, reps = clamp(L0.reps, it.lo, it.hi);
  if (deload) return Object.assign(t, {w:lighter(w, ex), reps:it.lo, state:'deload', chip:'Разгрузка', note:'Вес на 10% легче, половина подходов. Не до отказа.'});
  if (L0.ok){
    if (reps < it.hi){
      const step = it.hi - it.lo >= 8 ? 2 : 1;
      const nr = Math.min(it.hi, (L0.reps < it.lo ? it.lo : reps + step));
      return Object.assign(t, {w, reps:nr, state:'reps', chip:'+' + (nr - reps || step) + ' повт.', note:'Прошлый раз всё сделал. Вес тот же, повторов больше.'});
    }
    if (ex.inc > 0){
      const nw = fx(w + ex.inc);
      return Object.assign(t, {w:nw, reps:it.lo, state:'up', chip:(ex.bw && w < 0) ? '−' + fmtNum(ex.inc) + ' помощь' : '+' + fmtNum(ex.inc) + ' кг',
        note: it.lo < it.hi ? 'Дошёл до ' + it.hi + ' повторов. Вес тяжелее, повторы снова с ' + it.lo + '.' : (ex.bw && w < 0 ? 'Всё сделал — машина помогает меньше.' : 'Прошлый раз всё сделал — вес растёт.')});
    }
    return Object.assign(t, {w, reps:it.hi, state:'up', chip:'Усложни', note:ex.harder || 'Усложни вариант упражнения.'});
  }
  const L1 = H[1] ? evalEntry(H[1], it) : null;
  if (L1 && !L1.ok && L1.w === L0.w && L1.reps === L0.reps){
    let nw = w, nr = reps;
    if (it.lo < it.hi && reps > it.lo) nr = it.lo; else nw = lighter(w, ex);
    return Object.assign(t, {w:nw, reps:nr, state:'drop', chip:'Чуть легче', note:'Второй раз подряд не получилось — это нормально. Отходим назад и снова вверх.'});
  }
  return Object.assign(t, {w, reps, state:'hold', chip:'Повтори', note:'Прошлый раз не все повторы. Тот же вес — добей сегодня, отдыхай подольше.'});
}

/* ================= draft (today's inputs) ================= */
let draft = null, draftTimer = null;
function ensureDraft(P, targets){
  const key = P.n + '-' + P.letter;
  if (!draft) draft = lsGet(LS_DRAFT);
  if (!draft || draft.key !== key) draft = {key, vals:{}};
  P.items.forEach((it, i) => {
    if (draft.vals[it.id]) return;
    const t = targets[i], rows = [];
    for (let k = 0; k < t.sets; k++) rows.push({w:numStr(t.w), r:String(t.reps), done:false, open:t.w == null && k === 0});
    draft.vals[it.id] = rows;
  });
}
function persistDraft(){ clearTimeout(draftTimer); draftTimer = setTimeout(() => lsSet(LS_DRAFT, draft), 250); }

        <input id="r-${id}-${k}" data-f="r" data-ex="${id}" data-k="${k}" inputmode="numeric" autocomplete="off" aria-label="Повторы" value="${esc(row.r)}">

function updateSaveBtn(){
  const b = $('#saveBtn'); if (!b || !TODAY) return;
  let done = 0, total = 0;
  TODAY.P.items.forEach(it => { (draft.vals[it.id] || []).forEach(r => { total++; if (r.done) done++; }); });
  b.textContent = 'Завершить тренировку · ' + done + ' из ' + total;
}
function refreshRow(id, k){
  const row = draft.vals[id][k], el = document.getElementById('set-' + id + '-' + k); if (!el) return;
  const main = el.querySelector('.set-main');
  const val = main.querySelector('.set-val'); val.outerHTML = rowValueHtml(EX[id], row);
  el.classList.toggle('is-done', !!row.done); main.setAttribute('aria-pressed', String(!!row.done));
  const card = document.getElementById('card-' + id); if (card) card.classList.toggle('complete', draft.vals[id].every(r => r.done));
}
function setWeight(id, k, value){
  const rows = draft.vals[id], old = rows[k].w;
  rows[k].w = value;
  for (let j = k + 1; j < rows.length; j++){
    if (rows[j].done || (rows[j].w !== old && rows[j].w !== '')) continue;
    rows[j].w = value;
    const inp = document.getElementById('w-' + id + '-' + j); if (inp) inp.value = value;
    refreshRow(id, j);
  }
}
function onTodayInput(e){
  const el = e.target; if (!el.dataset || !el.dataset.f) return;
  const id = el.dataset.ex, k = +el.dataset.k;
  if (el.dataset.f === 'w') setWeight(id, k, el.value); else draft.vals[id][k].r = el.value;
  refreshRow(id, k); persistDraft();
}
function onTodayClick(e){
  const b = e.target.closest('button'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.ex, k = +b.dataset.k;
  if (act === 'toggle'){
    const ex = EX[id], row = draft.vals[id][k], err = document.getElementById('err-' + id);
    if (!row.done){
      if (!ex.bw && !(parseNum(row.w) >= 0)){ err.textContent = 'Сначала впиши вес: нажми «Изм.».'; err.hidden = false; return; }
      if (!(parseNum(row.r) > 0)){ err.textContent = 'Впиши, сколько повторов сделал.'; err.hidden = false; return; }
    }
    err.hidden = true;
    row.done = !row.done; if (row.done) row.open = false;
    const ed = document.getElementById('ed-' + id + '-' + k); if (ed) ed.hidden = !row.open;
    const eb = b.parentElement.querySelector('.set-edit'); eb.setAttribute('aria-expanded', String(!!row.open)); eb.textContent = row.open ? 'Готово' : 'Изм.';
    refreshRow(id, k); persistDraft(); updateSaveBtn();
    if (row.done) startTimer(ex.rest);
    return;
  }
  if (act === 'edit'){
    const row = draft.vals[id][k]; row.open = !row.open;
    document.getElementById('ed-' + id + '-' + k).hidden = !row.open;
    b.setAttribute('aria-expanded', String(row.open)); b.textContent = row.open ? 'Готово' : 'Изм.';
    if (row.open){ const inp = document.getElementById((EX[id].bw || row.w !== '' ? 'r-' : 'w-') + id + '-' + k); if (inp && row.w === '' && !EX[id].bw) inp.focus(); }
    persistDraft(); return;
  }
  if (act === 'w-' || act === 'w+'){
    const ex = EX[id], row = draft.vals[id][k]; let w = parseNum(row.w); if (isNaN(w)) w = 0;
    w = fx(w + (act === 'w+' ? 1 : -1) * ex.step); if (!ex.bw && w < 0) w = 0;
    const s = numStr(w); setWeight(id, k, s); document.getElementById('w-' + id + '-' + k).value = s; refreshRow(id, k); persistDraft(); return;
  }
  if (act === 'r-' || act === 'r+'){
    const row = draft.vals[id][k]; let r = Math.round(parseNum(row.r)); if (isNaN(r)) r = 0;
    r = Math.max(0, r + (act === 'r+' ? 1 : -1)); row.r = String(r);
    document.getElementById('r-' + id + '-' + k).value = row.r; refreshRow(id, k); persistDraft(); return;
  }
  if (b.dataset.goto){ showView('tech'); const t = document.getElementById('tech-' + b.dataset.goto); if (t) t.scrollIntoView({block:'start'}); return; }
  if (b.id === 'saveBtn') saveSession(b);
}
async function saveSession(btn){
  const P = TODAY.P, err = $('#saveErr');
  const entries = {}; let total = 0;
  P.items.forEach((it, i) => {
    const ex = EX[it.id], t = TODAY.targets[i];
    const sets = (draft.vals[it.id] || []).filter(r => r.done).map(r => {
      let w = parseNum(r.w); if (isNaN(w)) w = 0;
      return {w:fx(w), r:Math.round(parseNum(r.r)) || 0, done:true};
    }).filter(x => x.r > 0);
    if (!sets.length) return;
    const tw = t.w != null ? t.w : modeW(sets);
    entries[it.id] = {target:{w:tw, reps:t.reps, sets:t.sets}, sets};
    total += sets.length;
  });
  if (!total){ err.textContent = 'Пока не отмечен ни один подход. Нажми на подход, когда сделаешь его.'; err.hidden = false; return; }
  err.hidden = true; btn.disabled = true;
  const s = {kind:'session', d:new Date().toISOString(), n:P.n, letter:P.letter, phase:P.ph.id, deload:!!P.ph.deload, entries};
  try {
    await addSession(s);
    draft = null; lsDel(LS_DRAFT); stopTimer();
    const N = planFor(S.sessions.length);
    renderAll();
    toast('Сохранено. Следующая — тренировка ' + L[N.letter] + '.');
    window.scrollTo({top:0});
  } catch(e){
    err.textContent = 'Не сохранилось: нет связи. Отметки остались — нажми ещё раз.'; err.hidden = false;
  } finally { btn.disabled = false; }
}

function niceTicks(min, max, count){
  const span = max - min || 1, raw = span / count, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || raw;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, out = [];
  for (let v = lo; v <= hi + step / 2; v += step) out.push(fx(v));
  return out;
}
function lineChart(host, pts, unit){
  const W = Math.max(280, host.clientWidth || 600), H = 200, m = {l:42, r:14, t:14, b:26};
  const ys = pts.map(p => p.y); let mn = Math.min.apply(null, ys), mx = Math.max.apply(null, ys);
  if (mn === mx){ mn -= 1; mx += 1; }
  const ticks = niceTicks(mn, mx, 4), y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const X = i => m.l + (pts.length === 1 ? 0 : i * (W - m.l - m.r) / (pts.length - 1));
  const Y = v => m.t + (1 - (v - y0) / (y1 - y0 || 1)) * (H - m.t - m.b);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  const area = line + ` L${X(pts.length - 1).toFixed(1)} ${H - m.b} L${X(0).toFixed(1)} ${H - m.b} Z`;
  const grid = ticks.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l - 8}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--ink-3)">${fmtNum(t)}</text>`).join('');
  const li = pts.length - 1;
  host.innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="График, ${unit}">
    ${grid}
    <path d="${area}" fill="var(--accent)" fill-opacity="0.10"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(li).toFixed(1)}" cy="${Y(pts[li].y).toFixed(1)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${m.l}" y="${H - 6}" font-size="11" fill="var(--ink-3)">${esc(pts[0].x)}</text>
    <text x="${W - m.r}" y="${H - 6}" text-anchor="end" font-size="11" fill="var(--ink-3)">${esc(pts[li].x)}</text>
    <line class="xh" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>
    <circle class="hp" r="5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2" visibility="hidden"/>
    <rect class="hit" x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/>
  </svg><div class="tip" hidden></div></div>`;
  const svg = host.querySelector('svg'), tip = host.querySelector('.tip'), xh = svg.querySelector('.xh'), hp = svg.querySelector('.hp');
  function at(ev){
    const r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) * (W / r.width);
    let i = Math.round((sx - m.l) / ((W - m.l - m.r) / Math.max(1, pts.length - 1))); i = clamp(i, 0, pts.length - 1);
    const px = X(i), py = Y(pts[i].y);
    xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.setAttribute('visibility', 'visible');
    hp.setAttribute('cx', px); hp.setAttribute('cy', py); hp.setAttribute('visibility', 'visible');
    tip.textContent = pts[i].label; tip.hidden = false;
    tip.style.left = clamp(px * r.width / W, 60, r.width - 60) + 'px'; tip.style.top = (py * r.height / H) + 'px';
  }
  const hit = svg.querySelector('.hit');
  hit.addEventListener('pointermove', at); hit.addEventListener('pointerdown', at);
  hit.addEventListener('pointerleave', () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); hp.setAttribute('visibility', 'hidden'); });
}
function backupJson(){ return JSON.stringify({app:'zhurnal-pakharya', v:1, sessions:S.sessions, meta:S.meta}); }
async function restoreBackup(text){
  let d; try { d = JSON.parse(text); } catch(e){ throw new Error('Это не похоже на копию. Скопируй её целиком.'); }
  if (!d || !Array.isArray(d.sessions)) throw new Error('В копии нет тренировок. Скопируй её целиком.');
  const have = new Set(S.sessions.map(x => x.id));
  const add = d.sessions.filter(x => x && x.id && x.kind === 'session' && !have.has(x.id));
  const body = (d.meta && Array.isArray(d.meta.body)) ? d.meta.body : [];
  const dates = new Set(S.meta.body.map(x => x.d));
  const addBody = body.filter(x => x && x.d && !dates.has(x.d));
  if (S.db){ for (const s of add){ await withRetry(() => col().doc(s.id).set(bodyOf(s))); } }
  S.sessions = S.sessions.concat(add);
  S.meta.body = S.meta.body.concat(addBody);
  await saveMeta();
  return add.length;
}
function onProgressClick(e){
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'bkCopy'){
    const txt = backupJson(), ta = $('#bkText');
    const fallback = () => { ta.value = txt; ta.focus(); ta.select(); toast('Копия выделена в поле ниже — скопируй её.'); };
    try { navigator.clipboard.writeText(txt).then(() => toast('Копия скопирована. Сохрани её в заметки.'), fallback); } catch(err){ fallback(); }
    return;
  }
  if (b.id === 'bkRestore'){
    const err = $('#bkErr'), txt = $('#bkText').value.trim();
    if (!txt){ err.textContent = 'Сначала вставь копию в поле.'; err.hidden = false; return; }
    if (txt === backupJson()){ err.textContent = 'Это копия текущих данных — восстанавливать нечего.'; err.hidden = false; return; }
    b.disabled = true;
    restoreBackup(txt).then(n => { draft = null; lsDel(LS_DRAFT); renderAll(); toast(n ? 'Восстановлено тренировок: ' + n + '.' : 'Новых тренировок в копии нет.'); })
      .catch(x => { err.textContent = x && x.message ? x.message : 'Не получилось восстановить.'; err.hidden = false; })
      .finally(() => { b.disabled = false; });
    return;
  }
  if (b.id === 'bodySave'){
    const kg = parseNum($('#bkg').value), sh = parseNum($('#bsh').value), wa = parseNum($('#bwa').value), err = $('#bodyErr');
    if (isNaN(kg) && isNaN(sh) && isNaN(wa)){ err.textContent = 'Впиши хотя бы одно значение.'; err.hidden = false; return; }
    const d = new Date().toISOString().slice(0, 10), entry = {d};
    if (!isNaN(kg)) entry.kg = fx(kg); if (!isNaN(sh)) entry.sh = fx(sh); if (!isNaN(wa)) entry.wa = fx(wa);
    S.meta.body = S.meta.body.filter(x => x.d !== d).concat([entry]);
    saveMeta().then(() => toast('Замер записан.')).catch(() => toast('Сохранилось только на этом устройстве — нет связи.'));
    renderProgress(); return;
  }
  if (b.dataset.delbody){ S.meta.body = S.meta.body.filter(x => x.d !== b.dataset.delbody); saveMeta().catch(() => {}); renderProgress(); return; }
  if (b.dataset.delask){
    document.querySelector('[data-confirm="' + b.dataset.delask + '"]').innerHTML = `<span class="sub">Удалить тренировку?</span> <button class="linkbtn danger" type="button" data-delyes="${b.dataset.delask}">Да, удалить</button> <button class="linkbtn" type="button" data-delno="1">Нет</button>`;
    return;
  }
  if (b.dataset.delno){ renderProgress(); return; }
  if (b.dataset.delyes){
    deleteSession(b.dataset.delyes).then(() => { draft = null; lsDel(LS_DRAFT); renderAll(); toast('Тренировка удалена.'); }).catch(() => toast('Не удалось удалить: нет связи.'));
  }
}
